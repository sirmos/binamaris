<svg width="100%" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Binamaris architecture</title>
<desc>A spending request flows from the decision engine into the deterministic policy engine, which returns approved, needs approval, or rejected. Every outcome is written to the audit log. Approved requests proceed to execution through Binance Agent OS.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#4a5f7a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="630" rx="16" fill="#0a1a2f"/>

<rect x="230" y="20" width="220" height="56" rx="8" fill="#102a3f" stroke="#24425e" stroke-width="1"/>
<text x="340" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e8eef5">Spending request</text>
<text x="340" y="56" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8fa3b8">spending event</text>

<line x1="340" y1="76" x2="340" y2="108" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="112" width="220" height="56" rx="8" fill="#102a3f" stroke="#24425e" stroke-width="1"/>
<text x="340" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e8eef5">Decision engine</text>
<text x="340" y="148" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8fa3b8">interprets the situation</text>

<line x1="340" y1="168" x2="340" y2="200" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="204" width="220" height="56" rx="8" fill="#102a3f" stroke="#f0b90b" stroke-width="1.5"/>
<text x="340" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#f0b90b">Policy engine</text>
<text x="340" y="240" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#b9c6d6">deterministic, no LLM</text>

<line x1="340" y1="260" x2="160" y2="296" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="260" x2="340" y2="296" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="260" x2="520" y2="296" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="85" y="300" width="150" height="44" rx="8" fill="#0d2e28" stroke="#2dd4a7" stroke-width="1"/>
<text x="160" y="326" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#2dd4a7">Approved</text>

<rect x="265" y="300" width="150" height="44" rx="8" fill="#2b2308" stroke="#f0b90b" stroke-width="1"/>
<text x="340" y="326" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#f0b90b">Needs approval</text>

<rect x="445" y="300" width="150" height="44" rx="8" fill="#2e1414" stroke="#e5484d" stroke-width="1"/>
<text x="520" y="326" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#e5484d">Rejected</text>

<line x1="160" y1="344" x2="160" y2="390" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="344" x2="340" y2="390" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="344" x2="520" y2="390" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="85" y="394" width="510" height="56" rx="8" fill="#102a3f" stroke="#24425e" stroke-width="1"/>
<text x="340" y="412" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#e8eef5">Audit log</text>
<text x="340" y="430" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8fa3b8">every decision, always</text>

<line x1="340" y1="450" x2="340" y2="482" stroke="#4a5f7a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="486" width="260" height="56" rx="8" fill="#102a3f" stroke="#f0b90b" stroke-width="1.5"/>
<text x="340" y="504" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#f0b90b">Binance Agent OS</text>
<text x="340" y="522" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8fa3b8">sub-account, if approved</text>

<rect x="60" y="592" width="14" height="14" rx="3" fill="#0d2e28" stroke="#2dd4a7" stroke-width="1"/>
<text x="80" y="603" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8fa3b8">Approved</text>

<rect x="180" y="592" width="14" height="14" rx="3" fill="#2b2308" stroke="#f0b90b" stroke-width="1"/>
<text x="200" y="603" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8fa3b8">Needs approval</text>

<rect x="360" y="592" width="14" height="14" rx="3" fill="#2e1414" stroke="#e5484d" stroke-width="1"/>
<text x="380" y="603" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#8fa3b8">Rejected</text>
</svg>
